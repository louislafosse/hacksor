name: Runtime image

# Validates that the bundled Kali runtime image (docker/Dockerfile) still builds
# from scratch and that every core tool installs. The in-app build assertion
# (`core tools present: ok`) is the gate. It does NOT push: on Apple Silicon /
# Intel / Linux hosts the app builds this image locally for the host architecture
# via bollard on first use, so the image is always native-arch for the user.
#
# The image is large (~20 GB), so the build is moved onto the runner's big /mnt
# disk (~70 GB); the small root disk overflows during the final layer commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/**
  pull_request:
    paths:
      - docker/**

jobs:
  build-runtime:
    name: Build Kali runtime (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          docker-images: false
          large-packages: true
          tool-cache: true

      - name: Move Docker storage to the large /mnt disk
        run: |
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep -i "docker root dir" || true
          echo "--- disk ---"; df -h / /mnt

      - name: Build runtime image (validation, no push)
        run: DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile -t hacksor-runtime:ci docker/

      - name: Smoke-test bundled CLIs
        run: |
          docker run --rm hacksor-runtime:ci bash -lc '
            set -e
            for t in nmap nuclei ffuf sqlmap semgrep trufflehog gitleaks jwt_tool \
                     sstimap cloudfish hacksor-findings hacksor-proxy hacksor-session \
                     hacksor-subagent tmux codex; do
              command -v "$t" >/dev/null || { echo "MISSING: $t"; exit 1; }
            done
            echo "all bundled CLIs present"
          '
