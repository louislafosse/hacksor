name: Release

# On every push to main: semantic-release decides the next version from the
# conventional-commit history, bumps every version file, tags + creates the
# GitHub Release with generated notes; then the matrix builds signed-or-unsigned
# installers for macOS (arm64 + x64), Windows and Linux and uploads them to that
# release.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  # @semantic-release/github's post-publish "success"/"fail" steps comment on
  # any issues/PRs referenced by the released commits. Without these, that
  # step throws "Resource not accessible by integration" AFTER the release/tag
  # are already published, which fails the whole job — and since the build
  # matrix depends on this job's `published` output, which never gets set on
  # a failed run, every release silently shipped with zero installer assets.
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version & GitHub Release
    runs-on: ubuntu-22.04
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # python3 is preinstalled on ubuntu runners; scripts/set-version.py uses it.
      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Bundle ${{ matrix.label }}
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            label: Linux
            target: ""
            args: ""
          - platform: windows-latest
            label: Windows
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      # Build from the tag semantic-release just created so the bundle carries
      # the freshly bumped version.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build & upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked in at compile time (option_env!): pull the prebuilt runtime
          # image from GHCR on first run instead of building ~21 GB locally. The
          # tag is a multi-arch manifest (amd64 + arm64), so every platform pulls
          # its native arch. A local build stays the automatic fallback.
          HACKSOR_RUNTIME_IMAGE: ghcr.io/louislafosse/hacksor-runtime:latest
          # Ad-hoc sign the macOS bundles.
          #
          # Without this the .app carries only the linker's stub signature: a
          # hash-based identifier and NO sealed resources, which spctl rejects
          # with "code has no resources but signature indicates they must be
          # present". Combined with the browser's quarantine flag, macOS turns
          # that into "Hacksor.app is damaged and can't be opened. You should
          # move it to the Bin" - a dead end, with no way to open it.
          #
          # "-" is codesign's ad-hoc pseudo-identity, which Tauri's bundler
          # applies DURING bundling, so the signature is inside the dmg rather
          # than something the user has to repair afterwards. The result is a
          # valid signature (Identifier=dev.hacksor.app, Sealed Resources v2)
          # that passes `codesign --verify --deep --strict`.
          #
          # This does NOT remove Gatekeeper: an ad-hoc signature is not a
          # Developer ID, so a downloaded build still has to be approved
          # (right-click > Open, or Privacy & Security). It turns a fatal
          # "damaged" error into an approvable prompt. Empty on non-macOS
          # runners, where the bundler ignores it.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        # For a CLEAN double-click with no approval step, real signing +
        # notarization is the only route: add a step that sets
        # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
        # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        # from secrets ONLY when they exist (a real identity overrides the "-"
        # above). Passing them here empty makes the bundler try - and fail - to
        # import an empty certificate, which is why they are not listed.
        with:
          # Attach to the release semantic-release already created for this tag.
          tagName: v${{ needs.release.outputs.version }}
          args: ${{ matrix.args }}
