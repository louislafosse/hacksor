name: Publish runtime image

# Builds the bundled Kali runtime image and pushes it to GHCR so the app can
# DOWNLOAD it on first run (see HACKSOR_RUNTIME_IMAGE) instead of building ~21 GB
# locally. `buildx --push` streams each layer straight to the registry, so the
# full image is never assembled on the runner's disk — which also avoids the disk
# exhaustion a plain `docker build` hits here. amd64 only for now; Apple Silicon
# local-builds a native image (an amd64 pull would emulate).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/**
      - .github/workflows/publish-runtime.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          docker-images: false
          large-packages: true
          tool-cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/hacksor-runtime:latest
