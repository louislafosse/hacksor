[package]
name = "hacksor"
version = "1.0.1"
description = "Hacksor: local-first AI penetration testing assistant on the Codex harness"
authors = ["Hacksor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hacksor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "hacksor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dirs = "6"
include_dir = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
bollard = "0.17"
futures-util = "0.3"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 2
